<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #000;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden;
    }
    img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img id="kiosk-img" src="" alt="Loading random Wikimedia image...">

  <script>
    // Refresh interval in milliseconds (e.g., 30000 = 30 seconds)
    const REFRESH_INTERVAL = 30000;

    async function loadRandomImage() {
      try {
        const apiUrl = 'https://commons.wikimedia.org/w/api.php?action=query&generator=random&grnnamespace=6&prop=imageinfo&iiprop=url|mime&format=json&origin=*';
        const response = await fetch(apiUrl);
        const data = await response.json();
        
        const pages = data.query.pages;
        const firstKey = Object.keys(pages)[0];
        const imageInfo = pages[firstKey].imageinfo ? pages[firstKey].imageinfo[0] : null;

        // Ensure the file is an image (not audio, video, or PDF)
        if (imageInfo && imageInfo.mime.startsWith('image/')) {
          document.getElementById('kiosk-img').src = imageInfo.url;
        } else {
          loadRandomImage(); // Retry if it pulled a non-image file
        }
      } catch (err) {
        setTimeout(loadRandomImage, 5000);
      }
    }

    loadRandomImage();
    setInterval(loadRandomImage, REFRESH_INTERVAL);
  </script>
</body>
</html>
